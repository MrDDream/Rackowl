name: Release

# Pousser un tag vX.Y.Z (identique à versionName) compile l'APK signé et l'attache à la release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Check that the tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.RACKOWL_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rackowl-release.jks"

      - name: Tests and signed release APK
        env:
          RACKOWL_STORE_FILE: ${{ runner.temp }}/rackowl-release.jks
          RACKOWL_STORE_PASSWORD: ${{ secrets.RACKOWL_STORE_PASSWORD }}
          RACKOWL_KEY_ALIAS: ${{ secrets.RACKOWL_KEY_ALIAS }}
          RACKOWL_KEY_PASSWORD: ${{ secrets.RACKOWL_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/*-release.apk "Rackowl-$GITHUB_REF_NAME.apk"
          sha256sum "Rackowl-$GITHUB_REF_NAME.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Rackowl-$GITHUB_REF_NAME.apk" --clobber
          else
            NOTES="fastlane/metadata/android/en-US/changelogs/$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts).txt"
            if [ -f "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" "Rackowl-$GITHUB_REF_NAME.apk" --title "Rackowl $GITHUB_REF_NAME" --notes-file "$NOTES"
            else
              gh release create "$GITHUB_REF_NAME" "Rackowl-$GITHUB_REF_NAME.apk" --title "Rackowl $GITHUB_REF_NAME" --generate-notes
            fi
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rackowl-release.jks"
